<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antoine Boucher - CV</title>
  <meta name="description" content="Browser-language redirect to the English or French HTML CV; PDFs and blog links live on those resume pages.">
  <link rel="canonical" href="https://antoineboucher.info/CV/index.html">
  <meta property="og:title" content="Antoine Boucher — CV">
  <meta property="og:description" content="Browser-language redirect to the English or French HTML CV; PDFs and blog links live on those resume pages.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://antoineboucher.info/CV/index.html">
  <meta property="og:image" content="https://antoineboucher.info/CV/antoine.png">

  <meta name="twitter:title" content="Antoine Boucher — CV">

  <script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebPage","@id":"https://antoineboucher.info/CV/index.html#webpage","url":"https://antoineboucher.info/CV/index.html","name":"Antoine Boucher — CV","description":"Browser-language redirect to the English or French HTML CV; PDFs and blog links live on those resume pages."}
  </script>
  <script>
    // WebMCP (same tool as language CV pages) so GET / registers tools before redirect.
    (function () {
      var mc = navigator.modelContext || navigator.webModelContext;
      if (mc && typeof mc.provideContext === 'function') {
        try {
          mc.provideContext({
            tools: [
              {
                name: 'open_cv_pdf',
                description: 'Open the public CV PDF (English or French) in a new browser tab.',
                inputSchema: {
                  type: 'object',
                  properties: {
                    lang: { type: 'string', enum: ['en', 'fr'], description: 'CV language' }
                  },
                  required: ['lang']
                },
                execute: function (args) {
                  var lang = args && args.lang === 'fr' ? 'fr' : 'en';
                  var path = lang === 'fr' ? 'cv-fr/resume.pdf' : 'cv-en/resume.pdf';
                  window.open(path, '_blank', 'noopener,noreferrer');
                  return Promise.resolve({ opened: path });
                }
              }
            ]
          });
        } catch (e) { /* WebMCP preview API */ }
      }
    })();
    // Language detection and redirect
    (function() {
      const lang = navigator.language || navigator.userLanguage;
      const preferredLang = lang.startsWith('fr') ? 'fr' : 'en';
      window.location.href = 'index-' + preferredLang + '.html';
    })();
  </script>
</head>
<body>
  <p>Redirecting...</p>
  <p>If you are not redirected, please select your language:</p>
  <ul>
    <li><a href="index-en.html">English</a></li>
    <li><a href="index-fr.html">Français</a></li>
  </ul>
</body>
</html>
