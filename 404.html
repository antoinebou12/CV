<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page not found | Antoine Boucher</title>
    <meta name="description" content="This page was not found on Antoine Boucher's CV site. Go to the home page for the English or French resume, blog, and PDFs.">
    <link rel="canonical" href="https://antoineboucher.info/CV/404.html">
    <meta property="og:title" content="404 — Page not found | Antoine Boucher">
    <meta property="og:description" content="This page was not found on Antoine Boucher's CV site. Go to the home page for the English or French resume, blog, and PDFs.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://antoineboucher.info/CV/404.html">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        body,
        html {
            margin: 0;
            min-height: 100%;
        }

        body {
            background: oklch(0.398 0.047 248);
            color: oklch(0.31 0.035 240);
            font-family: "Open Sans", "Segoe UI", sans-serif;
        }

        #scene-container {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: #000;
        }

        .not-found {
            position: relative;
            z-index: 1;
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 32px 20px;
        }

        .not-found-card {
            width: min(100%, 28rem);
            padding: 32px 28px;
            background: oklch(0.985 0.006 190);
            border-radius: 6px;
        }

        .not-found h1 {
            margin: 0 0 8px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 32px;
            font-weight: 500;
            line-height: 1.2;
        }

        .not-found p {
            margin: 0;
            color: oklch(0.46 0.025 240);
            font-size: 16px;
            line-height: 1.5;
        }

        .not-found nav {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 20px;
            margin-top: 20px;
        }

        .not-found a {
            color: oklch(0.31 0.035 240);
            font-size: 15px;
            font-weight: 600;
        }

        @media (prefers-reduced-motion: reduce) {
            #scene-container { display: none; }
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
                "OrbitControls": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/controls/OrbitControls.js",
                "GLTFLoader": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/loaders/GLTFLoader.js",
                "FontLoader": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/loaders/FontLoader.js",
                "TextGeometry": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/geometries/TextGeometry.js"
            }
        }
        </script>
</head>

<body>
    <div id="scene-container" hidden></div>
    <main class="not-found">
        <div class="not-found-card">
            <h1>Page not found</h1>
            <p>This address is not on the site.</p>
            <nav aria-label="Continue">
                <a href="index-en.html">English CV</a>
                <a href="index-fr.html">CV français</a>
                <a href="https://antoineboucher.info/CV/blog/">Blog</a>
            </nav>
        </div>
    </main>
    <script type="module">
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            // The HTML card stays the page. Do not load the remote scene.
        } else {
        const THREE = await import('three');
        const { GLTFLoader } = await import('GLTFLoader');
        const { FontLoader } = await import('FontLoader');
        const { TextGeometry } = await import('TextGeometry');

        document.getElementById('scene-container').hidden = false;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 0.65;
        camera.position.y = 0;
        camera.position.x = 0;
        camera.zoom = 800;

        const clock = new THREE.Clock();

        // Directional light
        const light = new THREE.DirectionalLight();
        light.intensity = 3;
        light.position.set(0, 0.1, 1);
        scene.add(light);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('scene-container').appendChild(renderer.domElement);

        const loader = new GLTFLoader();
        loader.load(
            'https://raw.githubusercontent.com/olivierlarose/creative-404/main/public/medias/shards.glb',
            function (gltf) {
                gltf.scene.traverse(function (child) {
                    if (child.isMesh) {
                        child.material = new THREE.MeshPhysicalMaterial({
                            transmission: 0.99, // Makes the material fully transparent
                            thickness: 0.275, // Thickness of the material
                            ior: 1.8, // Index of Refraction
                            transparent: true,
                            roughness: 0,
                            clearcoat: 1,
                            clearcoatRoughness: 0.1,
                            reflectivity: 1,
                            metalness: 0.5,
                            color: 0xffffff
                        });
                    }
                });

                scene.add(gltf.scene);
            },
            undefined,
            function (error) {
                console.error('An error happened:', error);
            }
        );

        // Load 3D text
        var fontLoader = new FontLoader();
        fontLoader.load('https://threejs.org/examples/fonts/helvetiker_regular.typeface.json', function (font) {
            const textGeo = new TextGeometry('404 Not Found', {
                font: font,
                size: 0.2,
                depth: 0.01,
                anchorX: "center",
                anchorY: "middle"
            });
            const textGeo2 = new TextGeometry('The link is broken', {
                font: font,
                size: 0.1,
                depth: 0.01,
                anchorX: "center",
                anchorY: "middle"
            });
            const textMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff }); // White color
            const textMesh = new THREE.Mesh(textGeo, textMaterial);
            textMesh.position.set(-0.95, -.05, -0.55);
            scene.add(textMesh);
            const textMaterial2 = new THREE.MeshBasicMaterial({ color: 0xffffff }); // White color
            const textMesh2 = new THREE.Mesh(textGeo2, textMaterial2);
            textMesh2.position.set(-0.5, -.25, -0.65);
            scene.add(textMesh2);
        });

        window.addEventListener('resize', function () {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime()

            // Find a child of the scene with further children
            let targetChild = null;
            scene.children.forEach(child => {
                if (child.children.length > 0) {
                    targetChild = child;
                }
            });

            // If a child with further children is found, animate its children
            if (targetChild) {
                const shards = targetChild.children;
                shards.forEach((child, index) => {
                    // make it go up and down
                    child.position.x = Math.sin(elapsedTime * 1.1 + index) * 0.01;
                    child.position.y = Math.sin(elapsedTime * 1.1 + index) * 0.01;
                    child.rotateX(Math.sin(elapsedTime * 0.001 + index) * 0.001);
                });
            }

            renderer.render(scene, camera);
        }

        animate();
        }
    </script>
</body>

</html>
