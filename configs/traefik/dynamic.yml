# Traefik Dynamic Configuration
http:
  routers:
    # CV Site Router
    cv-site:
      rule: "Host(`localhost`) && PathPrefix(`/`)"
      entryPoints:
        - web
      service: cv-site
      priority: 10

    # Linktree Site Router
    linktree-site:
      rule: "Host(`localhost`) && PathPrefix(`/linktree`)"
      entryPoints:
        - web
      service: linktree-site
      middlewares:
        - linktree-stripprefix
      priority: 20

    # The Traefik API and dashboard stay on their own loopback-only port (8090);
    # they are not routed through the public "web" entrypoint.

  services:
    cv-site:
      loadBalancer:
        servers:
          - url: "http://cv-site:80"

    linktree-site:
      loadBalancer:
        servers:
          - url: "http://linktree-site:80"

  middlewares:
    # Strip /linktree prefix
    linktree-stripprefix:
      stripPrefix:
        prefixes:
          - "/linktree"
