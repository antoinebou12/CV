lead:
  en: >
    Software engineer in Montreal focused on platform engineering, reliability, backend systems,
    and interactive graphics. I build cloud delivery pipelines, developer tooling, and
    production-oriented services, with research work in C++/OpenGL, Blender, real-time
    simulation, and dynamic surface appearance.
  fr: >
    Ingénieur logiciel à Montréal, orienté ingénierie plateforme, fiabilité, systèmes backend
    et infographie interactive. Je conçois des pipelines de livraison cloud, de l'outillage
    développeur et des services orientés production, avec un axe de recherche en C++/OpenGL,
    Blender, simulation temps réel et apparence dynamique des surfaces.

