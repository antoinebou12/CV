faq:
  - id: who
    question:
      en: Who is Antoine Boucher?
      fr: Qui est Antoine Boucher ?
    answer:
      en: >
        Antoine Boucher is a software engineer in Montreal whose work spans platform
        engineering, backend systems, Kubernetes, GitLab CI/CD, Terraform, and interactive
        graphics with C++/OpenGL and Blender. His public CV, blog, and open-source projects
        are published at antoineboucher.info.
      fr: >
        Antoine Boucher est ingénieur logiciel à Montréal. Son travail combine ingénierie
        plateforme, systèmes backend, Kubernetes, GitLab CI/CD, Terraform et infographie
        interactive avec C++/OpenGL et Blender. Son CV, son blog et ses projets open source
        sont publiés sur antoineboucher.info.

  - id: platform-graphics
    question:
      en: What does platform and graphics mean in his work?
      fr: Que signifie plateforme et infographie dans son travail ?
    answer:
      en: >
        Platform engineering means the services, CI/CD pipelines, containers, cloud
        infrastructure, and observability that help product teams ship reliably. Graphics
        refers to real-time rendering, shaders, simulation, and Blender tooling as a
        technical research track, not a pure artist portfolio.
      fr: >
        L'ingénierie plateforme désigne les services, pipelines CI/CD, conteneurs,
        infrastructures cloud et éléments d'observabilité qui aident les équipes produit à
        livrer de façon fiable. L'infographie désigne le rendu temps réel, les shaders, la
        simulation et l'outillage Blender comme axe de recherche technique, pas comme
        portfolio artistique.

  - id: cicd-k8s
    question:
      en: What is his experience with secure CI/CD and Kubernetes?
      fr: Quelle est son expérience en CI/CD sécurisé et Kubernetes ?
    answer:
      en: >
        At IMC2, he worked with GitLab CI/CD across Java microservices on two GKE clusters
        in GCP, with Terraform for networking and observability plus JUnit and Playwright
        end-to-end tests. At Polytechnique Montreal, he teaches DevSecOps labs with Docker,
        Kubernetes, GitLab, and OWASP-oriented scenarios.
      fr: >
        À l'IMC2, il a travaillé avec GitLab CI/CD sur des microservices Java déployés sur
        deux clusters GKE dans GCP, avec Terraform pour le réseau et l'observabilité, puis
        JUnit et Playwright pour les tests. À Polytechnique Montréal, il enseigne des
        laboratoires DevSecOps avec Docker, Kubernetes, GitLab et des scénarios orientés OWASP.

  - id: uml-mcp
    question:
      en: What is uml-mcp?
      fr: Qu'est-ce que uml-mcp ?
    answer:
      en: >
        uml-mcp is an open-source Model Context Protocol server that turns architecture
        prompts into UML and related diagrams using Mermaid, PlantUML, and Kroki. Repository:
        https://github.com/antoinebou12/uml-mcp
      fr: >
        uml-mcp est un serveur Model Context Protocol open source qui transforme des prompts
        d'architecture en diagrammes UML et apparentés avec Mermaid, PlantUML et Kroki.
        Dépôt: https://github.com/antoinebou12/uml-mcp

  - id: contact
    question:
      en: How can recruiters or collaborators contact him?
      fr: Comment le joindre pour un poste ou une collaboration ?
    answer:
      en: >
        Book a 30-minute intro call at https://cal.com/antoine-boucher-dev/30min, email
        antoine@antoineboucher.info, or use the interactive CV at
        https://antoineboucher.info/CV/index-en.html
      fr: >
        Réserver un appel d'introduction de 30 minutes sur
        https://cal.com/antoine-boucher-dev/30min, écrire à antoine@antoineboucher.info, ou
        consulter le CV interactif à https://antoineboucher.info/CV/index-fr.html

  - id: machine-readable
    question:
      en: Where is his machine-readable resume for agents and parsers?
      fr: Où trouver son CV machine-lisible pour agents et parseurs ?
    answer:
      en: >
        Use JSON Resume at https://antoineboucher.info/CV/resume.json, Markdown at
        https://antoineboucher.info/CV/resume.md, and agent discovery files under
        https://antoineboucher.info/CV/.well-known/ plus llms.txt on the site root.
      fr: >
        Utiliser JSON Resume à https://antoineboucher.info/CV/resume-fr.json, le Markdown à
        https://antoineboucher.info/CV/resume-fr.md, les fichiers de découverte sous
        https://antoineboucher.info/CV/.well-known/ et llms.txt à la racine du site.

