# Personal competence domains for CV Competences + Hugo project filters.
# Majors → subs. Employer-internal buckets are intentionally omitted.

majors:
  - id: languages-formats
    label:
      en: Languages & formats
      fr: Langages et formats
    subs:
      - id: languages
        label:
          en: Languages
          fr: Langages
      - id: formats
        label:
          en: Formats & serialization
          fr: Formats et sérialisation
      - id: documentation
        label:
          en: Design & documentation
          fr: Conception et documentation

  - id: application
    label:
      en: Application
      fr: Applicatif
    subs:
      - id: frontend
        label:
          en: Frontend & UI
          fr: Frontend et UI
      - id: runtimes
        label:
          en: Web servers & runtimes
          fr: Serveurs web et runtimes
      - id: backend
        label:
          en: Backend & API
          fr: Backend et API
      - id: cli
        label:
          en: CLI & developer tools
          fr: CLI et outils de développement

  - id: graphics-3d
    label:
      en: Graphics / 3D
      fr: Graphismes / 3D
    subs:
      - id: realtime
        label:
          en: Real-time rendering
          fr: Rendu temps réel
      - id: assets-compute
        label:
          en: Assets & compute
          fr: Assets et calcul

  - id: data-analytics
    label:
      en: Data & analytics
      fr: Données et analytique
    subs:
      - id: databases
        label:
          en: Databases
          fr: Bases de données
      - id: connectors
        label:
          en: Connectors & messaging
          fr: Connecteurs et messagerie
      - id: ia-llm
        label:
          en: AI & LLM
          fr: IA et LLM

  - id: platform-devops
    label:
      en: Platform & DevOps
      fr: Plateforme et DevOps
    subs:
      - id: cicd
        label:
          en: CI/CD & deployment
          fr: CI/CD et déploiement
      - id: cloud
        label:
          en: Cloud & infrastructure
          fr: Cloud et infrastructure
      - id: containers
        label:
          en: Containers & systems
          fr: Conteneurs et systèmes
      - id: observability
        label:
          en: Observability
          fr: Observabilité
      - id: security-practice
        label:
          en: Security & practice
          fr: Sécurité et pratiques

  - id: quality-tests
    label:
      en: Quality & tests
      fr: Qualité et tests
    subs:
      - id: quality
        label:
          en: Quality & tests
          fr: Qualité et tests

