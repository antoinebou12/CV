# Base URL is overridden in CI for GitHub Pages (…/repo/blog/).
baseURL = "http://localhost:1313/blog/"
languageCode = "en-us"
timeZone = "America/Toronto"
title = "Antoine Boucher"
theme = "paper"
# Custom `hugo/static/robots.txt` is the source of truth (RFC 9309 + Content Signals).
enableRobotsTXT = false

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[pagination]
pagerSize = 12

[languages.en]
languageName = "EN"
weight = 1

[[languages.en.menus.main]]
name = "Posts"
pageRef = "/posts"
weight = 10

[[languages.en.menus.main]]
name = "Projects"
pageRef = "/projects"
weight = 11

[[languages.en.menus.main]]
name = "Conference"
pageRef = "/tags/conference"
weight = 12

[[languages.en.menus.main]]
name = "Recipes"
pageRef = "/recipes"
weight = 15

[[languages.en.menus.main]]
name = "Search"
pageRef = "/search"
weight = 20

[languages.fr]
languageName = "FR"
weight = 2

[languages.fr.params]
description = "Blog et portfolio d’ingénierie logicielle : plateforme, infographie, Rust, systèmes et performance, projets et notes par Antoine Boucher, à Montréal."
bio = "Ingénieur logiciel orienté plateforme et infographie ; articles sur Rust, systèmes et performance."

[[languages.fr.menus.main]]
name = "Articles"
pageRef = "/posts"
weight = 10

[[languages.fr.menus.main]]
name = "Projets"
pageRef = "/projects"
weight = 11

[[languages.fr.menus.main]]
name = "Conférences"
pageRef = "/tags/conference"
weight = 12

[[languages.fr.menus.main]]
name = "Recettes"
pageRef = "/recipes"
weight = 15

[[languages.fr.menus.main]]
name = "Recherche"
pageRef = "/search"
weight = 20

# Only the `tags` taxonomy (omit default unused `categories`).
[taxonomies]
tag = "tags"

[params]
color = "linen"
github = "antoinebou12"
linkedin = "antoineboucher12"
# Home / list meta description (50–160 chars) for SEO and AI summaries.
description = "Software engineering blog and portfolio: platform, graphics, Rust, systems, and performance, projects and notes by Antoine Boucher in Montréal."
# Default Open Graph image (under hugo/static/); pages with front matter `images` override.
images = ["images/post-kind-article.png"]
# GitHub Pages project sites use /REPO/ in URLs; set via HUGO_PARAMS_GITHUBPAGESREPO in deploy (repository name).
githubpagesrepo = ""
rss = true
monoDarkIcon = true
mainSections = ["posts"]
name = "Antoine Boucher"
bio = "Software engineer focused on platform and graphics; writing on Rust, systems, and performance."
preloadSocialIcons = 3

# Every page also publishes a Markdown "context" view at <page-url>index.md for agents and
# answer engines (layouts/_default/*.context.md). Sections publish an index.md catalog.
[mediaTypes."text/markdown"]
suffixes = ["md"]

[outputFormats.Context]
mediaType = "text/markdown"
baseName = "index"
isPlainText = true
rel = "alternate"
notAlternative = false

[outputs]
home = ["HTML", "RSS", "JSON"]
page = ["HTML", "Context"]
section = ["HTML", "RSS", "Context"]

[markup.goldmark.renderer]
unsafe = true

# Share the browser tools with the static CV without duplicating their source.
[[module.mounts]]
source = "assets"
target = "assets"
[[module.mounts]]
source = "../js/site-webmcp.js"
target = "assets/site-webmcp.js"
# Self-hosted web fonts live beside the CV stylesheets (scripts/build/fetch_fonts.py).
[[module.mounts]]
source = "static"
target = "static"
[[module.mounts]]
source = "../css/fonts"
target = "static/fonts"
files = ["*.woff2"]
