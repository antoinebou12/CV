# Base URL is overridden in CI for GitHub Pages (…/repo/blog/).
baseURL = "http://localhost:1313/blog/"
languageCode = "en-us"
title = "Antoine Boucher"
theme = "paper"
# Custom `hugo/static/robots.txt` is the source of truth (RFC 9309 + Content Signals).
enableRobotsTXT = false

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[pagination]
pagerSize = 12

[languages.en]
languageName = "EN"
weight = 1

[[languages.en.menus.main]]
name = "Posts"
pageRef = "/posts"
weight = 10

[[languages.en.menus.main]]
name = "Conference"
pageRef = "/tags/conference"
weight = 12

[[languages.en.menus.main]]
name = "Recipes"
pageRef = "/recipes"
weight = 15

[[languages.en.menus.main]]
name = "Search"
pageRef = "/search"
weight = 20

[languages.fr]
languageName = "FR"
weight = 2

[languages.fr.params]
description = "Blog et portfolio d’ingénierie logicielle : plateforme, infographie, Rust, systèmes et performance, projets et notes par Antoine Boucher, à Montréal."
bio = "Ingénieur logiciel orienté plateforme et infographie ; articles sur Rust, systèmes et performance."

[[languages.fr.menus.main]]
name = "Articles"
pageRef = "/posts"
weight = 10

[[languages.fr.menus.main]]
name = "Conférences"
pageRef = "/tags/conference"
weight = 12

[[languages.fr.menus.main]]
name = "Recettes"
pageRef = "/recipes"
weight = 15

[[languages.fr.menus.main]]
name = "Recherche"
pageRef = "/search"
weight = 20

# Only the `tags` taxonomy (omit default unused `categories`).
[taxonomies]
tag = "tags"

[params]
color = "linen"
github = "antoinebou12"
linkedin = "antoineboucher"
# Home / list meta description (50–160 chars) for SEO and AI summaries.
description = "Software engineering blog and portfolio: platform, graphics, Rust, systems, and performance, projects and notes by Antoine Boucher in Montréal."
# Default Open Graph image (under hugo/static/); pages with front matter `images` override.
images = ["images/post-kind-article.png"]
# GitHub Pages project sites use /REPO/ in URLs; set via HUGO_PARAMS_GITHUBPAGESREPO in deploy (repository name).
githubpagesrepo = ""
rss = true
monoDarkIcon = true
mainSections = ["posts"]
name = "Antoine Boucher"
bio = "Software engineer focused on platform and graphics; writing on Rust, systems, and performance."
preloadSocialIcons = 3

[outputs]
home = ["HTML", "RSS", "JSON"]

[markup.goldmark.renderer]
unsafe = true
