# Base URL is overridden in CI for GitHub Pages (…/repo/blog/).
baseURL = "http://localhost:1313/blog/"
languageCode = "en-us"
title = "Antoine Boucher"
theme = "paper"
enableRobotsTXT = true

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[languages.en]
languageName = "EN"
weight = 1

[[languages.en.menus.main]]
name = "Posts"
pageRef = "/posts"
weight = 10

[[languages.en.menus.main]]
name = "Recipes"
pageRef = "/recipes"
weight = 15

[[languages.en.menus.main]]
name = "Projects"
pageRef = "/projects"
weight = 17

[[languages.en.menus.main]]
name = "Search"
pageRef = "/search"
weight = 20

[languages.fr]
languageName = "FR"
weight = 2

[[languages.fr.menus.main]]
name = "Articles"
pageRef = "/posts"
weight = 10

[[languages.fr.menus.main]]
name = "Recettes"
pageRef = "/recipes"
weight = 15

[[languages.fr.menus.main]]
name = "Projets"
pageRef = "/projects"
weight = 17

[[languages.fr.menus.main]]
name = "Recherche"
pageRef = "/search"
weight = 20

[params]
color = "linen"
github = "antoinebou12"
rss = true
monoDarkIcon = true
mainSections = ["posts"]

[outputs]
home = ["HTML", "RSS", "JSON"]

[markup.goldmark.renderer]
unsafe = true
