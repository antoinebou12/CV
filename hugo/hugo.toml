# Base URL is overridden in CI for GitHub Pages (…/repo/blog/).
baseURL = "http://localhost:1313/blog/"
languageCode = "en-us"
title = "Antoine Boucher"
theme = "paper"
enableRobotsTXT = true

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[pagination]
pagerSize = 12

[languages.en]
languageName = "EN"
weight = 1

[[languages.en.menus.main]]
name = "Posts"
pageRef = "/posts"
weight = 10

[[languages.en.menus.main]]
name = "Conference"
pageRef = "/tags/conference"
weight = 12

[[languages.en.menus.main]]
name = "Recipes"
pageRef = "/recipes"
weight = 15

[[languages.en.menus.main]]
name = "Projects"
pageRef = "/projects"
weight = 17

[[languages.en.menus.main]]
name = "Search"
pageRef = "/search"
weight = 20

[languages.fr]
languageName = "FR"
weight = 2

[[languages.fr.menus.main]]
name = "Articles"
pageRef = "/posts"
weight = 10

[[languages.fr.menus.main]]
name = "Conférences"
pageRef = "/tags/conference"
weight = 12

[[languages.fr.menus.main]]
name = "Recettes"
pageRef = "/recipes"
weight = 15

[[languages.fr.menus.main]]
name = "Projets"
pageRef = "/projects"
weight = 17

[[languages.fr.menus.main]]
name = "Recherche"
pageRef = "/search"
weight = 20

# Only the `tags` taxonomy (omit default unused `categories`).
[taxonomies]
tag = "tags"

[params]
color = "linen"
github = "antoinebou12"
linkedin = "antoineboucher"
# GitHub Pages project sites use /REPO/ in URLs; set via HUGO_PARAMS_GITHUBPAGESREPO in deploy (repository name).
githubpagesrepo = ""
rss = true
monoDarkIcon = true
mainSections = ["posts"]
name = "Antoine Boucher"
bio = "Software developer focused on Rust, performance, and practical engineering."
# Latest project cards on the home page (see layouts/_default/list.html).
homeProjectLimit = 6
preloadSocialIcons = 3

[params.cvSidebar]
enabled = false
showOnHome = true
showProfile = true
showLinks = true
showStats = false
location = "Montréal, QC"

[[params.cvSidebar.extraLinks]]
name = "Resume"
url = "https://antoineboucher.info/index-en.html"

[[params.cvSidebar.extraLinks]]
name = "Projects"
url = "https://antoineboucher.info/blog/projects/"

[outputs]
home = ["HTML", "RSS", "JSON"]

[markup.goldmark.renderer]
unsafe = true
