<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d">
  <title id="t">bloc: a Blender panel that browses S3 and MinIO buckets</title>
  <desc id="d">Three bucket shapes on the left connect through a bloc panel to a Blender scene on the right.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f3344"/><stop offset="1" stop-color="#0f1b26"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7fbfb"/><stop offset="1" stop-color="#e3eeee"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g font-family="'Open Sans', system-ui, sans-serif" fill="#edf4fb">
    <text x="72" y="96" font-size="22" letter-spacing="4" fill="#79ded2" font-weight="700">BLENDER ADD-ON · OBJECT STORAGE</text>
    <text x="72" y="190" font-size="104" font-family="Fraunces, Georgia, serif" font-weight="500" letter-spacing="-3">bloc</text>
    <text x="72" y="238" font-size="26" fill="#c2d0de">Browse S3 and MinIO buckets, import meshes, stay in Blender.</text>
  </g>
  <!-- buckets -->
  <g stroke="#79ded2" stroke-width="3" fill="#163041">
    <g transform="translate(100 330)"><path d="M0 0h130l-14 110H14z"/><ellipse cx="65" cy="0" rx="65" ry="16"/><text x="65" y="70" text-anchor="middle" font-size="20" fill="#edf4fb" stroke="none" font-family="ui-monospace, monospace">s3://</text></g>
    <g transform="translate(100 470)"><path d="M0 0h130l-14 110H14z"/><ellipse cx="65" cy="0" rx="65" ry="16"/><text x="65" y="70" text-anchor="middle" font-size="20" fill="#edf4fb" stroke="none" font-family="ui-monospace, monospace">minio</text></g>
  </g>
  <!-- connections -->
  <g stroke="#79ded2" stroke-width="3" fill="none" stroke-dasharray="10 10">
    <path d="M232 385 C 320 385, 320 450, 400 450"/>
    <path d="M232 525 C 320 525, 320 450, 400 450"/>
    <path d="M760 450 C 840 450, 840 430, 920 430"/>
  </g>
  <!-- panel -->
  <g transform="translate(400 330)">
    <rect width="360" height="240" rx="18" fill="url(#panel)"/>
    <rect x="0" y="0" width="360" height="44" rx="18" fill="#dbe7e7"/>
    <text x="22" y="29" font-size="18" font-weight="700" fill="#192a3c" font-family="system-ui, sans-serif">Cloud Storage · bloc</text>
    <g font-family="ui-monospace, monospace" font-size="18" fill="#192a3c">
      <rect x="20" y="62" width="320" height="36" rx="8" fill="#ffffff" stroke="#becfdf"/><text x="34" y="86" fill="#4e6070">search assets…</text>
      <text x="34" y="132">▸ scenes/</text>
      <text x="34" y="166" fill="#006a62">  spaceship_v3.blend</text>
      <text x="34" y="200">▸ textures/</text>
      <rect x="236" y="150" width="104" height="30" rx="7" fill="#006a62"/><text x="288" y="171" text-anchor="middle" fill="#fff" font-size="15" font-weight="700" font-family="system-ui, sans-serif">Import</text>
    </g>
  </g>
  <!-- blender viewport -->
  <g transform="translate(920 330)">
    <rect width="208" height="240" rx="18" fill="#1b2a38" stroke="#3a4d63" stroke-width="2"/>
    <g stroke="#3a4d63" stroke-width="1"><path d="M20 200 L188 200 M40 180 L168 180 M60 160 L148 160"/><path d="M60 220 L80 120 M104 220 L104 120 M148 220 L128 120"/></g>
    <g transform="translate(104 150)" stroke="#79ded2" stroke-width="3" fill="#163041"><path d="M-40 -20 L0 -44 L40 -20 L40 24 L0 48 L-40 24 Z"/><path d="M-40 -20 L0 4 L40 -20 M0 4 L0 48"/></g>
    <text x="104" y="36" text-anchor="middle" font-size="16" fill="#c2d0de" font-family="system-ui, sans-serif">Blender scene</text>
  </g>
</svg>
