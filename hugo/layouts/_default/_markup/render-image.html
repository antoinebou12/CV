{{- /*
  Markdown images in page bundles become responsive WebP renditions with intrinsic
  width/height (no layout shift), lazy loading and a srcset for phones. GIF, SVG and
  remote images pass through untouched. A title becomes a <figure> caption.
*/ -}}
{{- $dest := .Destination -}}
{{- /* Remote sources are emitted with safeURL below, so only allow web schemes. */ -}}
{{- $probe := lower (replaceRE `[\x00-\x20]` "" $dest) -}}
{{- if and (findRE `^[a-z][a-z0-9+.-]*:` $probe) (not (findRE `^https?:` $probe)) -}}{{- $dest = "" -}}{{- end -}}
{{- $alt := .Text | plainify -}}
{{- $res := "" -}}
{{- if not (or (hasPrefix $dest "http") (hasPrefix $dest "//")) -}}
  {{- /* Bundle resources are shared between translations: the English page owns the published files. */ -}}
  {{- $owner := .Page -}}
  {{- range .Page.AllTranslations }}{{ if eq .Lang "en" }}{{ $owner = . }}{{ end }}{{ end -}}
  {{- $clean := strings.TrimPrefix "./" $dest -}}
  {{- with $owner.Resources.GetMatch $clean -}}{{ $res = . }}{{ end -}}
{{- end -}}
{{- $isRaster := false -}}
{{- with $res -}}{{- if not (in (slice "gif" "svg" "svg+xml") .MediaType.SubType) -}}{{- $isRaster = true -}}{{- end -}}{{- end -}}
{{- $figure := .Title -}}
{{- if $figure }}<figure class="article-figure">{{ end -}}
{{- if $isRaster -}}
  {{- $widths := slice 480 800 1200 -}}
  {{- $set := slice -}}
  {{- range $widths -}}
    {{- if lt . $res.Width -}}
      {{- $v := $res.Process (printf "resize %dx webp q82" .) -}}
      {{- $set = $set | append (printf "%s %dw" $v.RelPermalink $v.Width) -}}
    {{- end -}}
  {{- end -}}
  {{- $main := $res -}}
  {{- if gt $res.Width 1200 }}{{ $main = $res.Process "resize 1200x webp q82" }}{{ else }}{{ $main = $res.Process "webp q82" }}{{ end -}}
  {{- $set = $set | append (printf "%s %dw" $main.RelPermalink $main.Width) -}}
  <img src="{{ $main.RelPermalink }}" srcset="{{ delimit $set ", " }}" sizes="(max-width: 840px) calc(100vw - 48px), 800px" width="{{ $main.Width }}" height="{{ $main.Height }}" alt="{{ $alt }}" loading="lazy" decoding="async" data-full="{{ $res.RelPermalink }}" />
{{- else -}}
  <img src="{{ with $res }}{{ .RelPermalink }}{{ else }}{{ $dest | safeURL }}{{ end }}" alt="{{ $alt }}" loading="lazy" decoding="async"{{ with $res }}{{ if eq .MediaType.SubType "gif" }} width="{{ .Width }}" height="{{ .Height }}"{{ end }}{{ end }} />
{{- end -}}
{{- if $figure }}<figcaption>{{ $figure | markdownify }}</figcaption></figure>{{ end -}}
