<footer
  class="site-footer mx-auto flex h-[4.5rem] max-w-(--w) items-center px-8 text-xs tracking-wider uppercase opacity-60"
>
  <div class="mr-auto">
    {{- if site.Copyright -}} {{- site.Copyright -}} {{- else -}} &copy; {{-
    now.Year }}
    <a class="link" href="{{- `` | absURL -}}">{{- site.Title -}}</a>
    {{- end -}}
  </div>
  {{- with .OutputFormats.Get "Context" }}
  <a class="link mx-6" href="{{ .Permalink }}" type="text/markdown" title="{{ if eq $.Lang "fr" }}Version Markdown de cette page pour les agents et la lecture brute{{ else }}Markdown view of this page for agents and raw reading{{ end }}">Markdown</a>
  {{- end }}
  <a class="link mx-6" href="https://gohugo.io/" rel="noopener" target="_blank"
    >Powered by Hugo</a
  >
</footer>
