{{- /* Client-side search, filters and sorting for repository card directories (projects, stars). */ -}}
<script>
  const explorer = document.querySelector('[data-repo-explorer]');
  if (explorer) {
    const cards = [...document.querySelectorAll('.repo-directory-card')];
    const groups = [...document.querySelectorAll('[data-repo-groups] .repo-directory-group')];
    const search = explorer.querySelector('[data-repo-search]');
    const sort = explorer.querySelector('[data-repo-sort]');
    const empty = explorer.querySelector('[data-repo-empty]');
    const count = explorer.querySelector('[data-repo-count]');
    let style = '';
    let domain = '';
    let origin = '';
    const groupHost = document.querySelector('[data-repo-groups]');
    const originalOrder = groups.slice();
    const normalize = (value) => value.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    function apply() {
      // Every typed word has to match (accent-insensitive), so "rust render" narrows instead of widening.
      const terms = normalize(search.value.trim()).split(/\s+/).filter(Boolean);
      let visible = 0;
      for (const card of cards) {
        const hay = normalize(card.dataset.search || '');
        const styles = (card.dataset.styles || '').split(/\s+/).filter(Boolean);
        const domains = (card.dataset.domains || '').split(/\s+/).filter(Boolean);
        const styleOk = !style || styles.includes(style);
        const domainOk = !domain || domains.includes(domain);
        const originOk = !origin || card.dataset.origin === origin;
        const show = styleOk && domainOk && originOk && terms.every(term => hay.includes(term));
        card.hidden = !show;
        if (show) visible += 1;
      }
      for (const group of groups) {
        const shown = [...group.querySelectorAll('.repo-directory-card')].filter(card => !card.hidden).length;
        group.hidden = shown === 0;
        const groupCount = group.querySelector('.repo-group-count');
        if (groupCount) groupCount.textContent = String(shown);
        group.classList.toggle('is-secondary-match', Boolean(style) && group.dataset.projectType !== style);
      }
      // A chosen type leads: its group comes first and open; groups that only match through a
      // secondary type follow, collapsed, so the reader sees the focus before the rest.
      if (groupHost) {
        const ordered = style
          ? [...groups.filter(g => g.dataset.projectType === style), ...groups.filter(g => g.dataset.projectType !== style)]
          : originalOrder;
        ordered.forEach(group => groupHost.append(group));
        for (const group of groups) {
          if (style) group.open = group.dataset.projectType === style;
          else if (group.dataset.wasOpen !== undefined) { group.open = group.dataset.wasOpen === 'true'; delete group.dataset.wasOpen; }
        }
      }
      empty.hidden = visible !== 0;
      count.textContent = String(visible);
    }
    for (const group of groups) group.addEventListener('toggle', () => { if (!style) group.dataset.wasOpen = String(group.open); });
    function sortCards() {
      for (const list of document.querySelectorAll('.repo-directory-grid')) {
        const items = [...list.children];
        items.sort((a, b) => {
          if (sort.value === 'name') return a.dataset.name.localeCompare(b.dataset.name);
          if (sort.value === 'activity') return (b.dataset.pushed || '').localeCompare(a.dataset.pushed || '');
          return Number(b.dataset.stars || 0) - Number(a.dataset.stars || 0);
        });
        for (const item of items) list.append(item);
      }
    }
    function pressGroup(selector, active) {
      for (const button of explorer.querySelectorAll(selector)) {
        button.setAttribute('aria-pressed', button === active ? 'true' : 'false');
      }
    }
    search.addEventListener('input', apply);
    sort.addEventListener('change', () => { sortCards(); apply(); });
    explorer.querySelector('[data-repo-reset]').addEventListener('click', () => {
      search.value = '';
      style = '';
      domain = '';
      origin = '';
      sort.value = 'stars';
      pressGroup('[data-repo-style]', explorer.querySelector('[data-repo-style=""]'));
      pressGroup('[data-repo-domain]', explorer.querySelector('[data-repo-domain=""]'));
      pressGroup('[data-repo-origin]', explorer.querySelector('[data-repo-origin=""]'));
      sortCards();
      apply();
      search.focus();
    });
    function bindFilterGroup(selector, onPick) {
      const buttons = [...explorer.querySelectorAll(selector)];
      for (const button of buttons) {
        button.addEventListener('click', () => onPick(button));
        button.addEventListener('keydown', (event) => {
          const idx = buttons.indexOf(button);
          if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
            event.preventDefault();
            buttons[Math.min(buttons.length - 1, idx + 1)].focus();
          } else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
            event.preventDefault();
            buttons[Math.max(0, idx - 1)].focus();
          } else if (event.key === 'Home') {
            event.preventDefault();
            buttons[0].focus();
          } else if (event.key === 'End') {
            event.preventDefault();
            buttons[buttons.length - 1].focus();
          }
        });
      }
    }
    bindFilterGroup('[data-repo-origin]', (button) => {
      origin = button.dataset.repoOrigin;
      pressGroup('[data-repo-origin]', button);
      apply();
    });
    bindFilterGroup('[data-repo-style]', (button) => {
      style = button.dataset.repoStyle;
      pressGroup('[data-repo-style]', button);
      apply();
    });
    bindFilterGroup('[data-repo-domain]', (button) => {
      domain = button.dataset.repoDomain;
      pressGroup('[data-repo-domain]', button);
      apply();
    });
  }
</script>
