{{- /* Compact command block. Expects .commands, .title, optional .foot_url, .fr. */ -}}
{{- $fr := .fr -}}
{{- $title := .title -}}
{{- $commands := .commands -}}
{{- $foot := .foot_url -}}
<div class="terminal" role="group" aria-label="{{ if $fr }}Commande du dépôt{{ else }}Repository command{{ end }}">
  <div class="terminal-head">
    <span class="terminal-title"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M3 3.5A1.5 1.5 0 0 1 4.5 2h11A1.5 1.5 0 0 1 17 3.5v13a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 16.5v-13Zm1.5-.25a.25.25 0 0 0-.25.25v13c0 .14.11.25.25.25h11a.25.25 0 0 0 .25-.25v-13a.25.25 0 0 0-.25-.25h-11ZM6 6.1l2.15 1.9L6 9.9l-.8-.9L6.35 8 5.2 7l.8-.9Zm3.5 3.15h4v1.25h-4V9.25Z"/></svg><span>{{ $title }}</span></span>
    <button type="button" class="copy" data-copy><svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M6.5 2A2.5 2.5 0 0 0 4 4.5v8A2.5 2.5 0 0 0 6.5 15H7v.5A2.5 2.5 0 0 0 9.5 18h6a2.5 2.5 0 0 0 2.5-2.5v-8A2.5 2.5 0 0 0 15.5 5H15v-.5A2.5 2.5 0 0 0 12.5 2h-6Zm7.25 3H9.5A2.5 2.5 0 0 0 7 7.5v6.25h-.5a1.25 1.25 0 0 1-1.25-1.25v-8A1.25 1.25 0 0 1 6.5 3.25h6a1.25 1.25 0 0 1 1.25 1.25V5ZM9.5 6.25h6a1.25 1.25 0 0 1 1.25 1.25v8a1.25 1.25 0 0 1-1.25 1.25h-6a1.25 1.25 0 0 1-1.25-1.25v-8A1.25 1.25 0 0 1 9.5 6.25Z"/></svg><span>{{ if $fr }}Copier{{ else }}Copy{{ end }}</span></button>
  </div>
  <div class="terminal-panel">
    <pre class="terminal-body" tabindex="0"><code>{{ $commands }}</code></pre>
  </div>
</div>
