{{- if or .Params.mermaid (in .RawContent "```mermaid") -}}
<script type="module">
  const blocks = [...document.querySelectorAll('pre > code.language-mermaid')];
  try {
    const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@11.12.0/dist/mermaid.esm.min.mjs');
    mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: document.documentElement.classList.contains('dark') ? 'dark' : 'neutral' });
    for (const [index, block] of blocks.entries()) {
      const source = block.textContent;
      try {
        const { svg } = await mermaid.render(`post-diagram-${index}`, source);
        const figure = document.createElement('figure');
        figure.className = 'post-diagram';
        figure.setAttribute('aria-label', document.documentElement.lang.startsWith('fr') ? 'Diagramme du projet' : 'Project diagram');
        figure.innerHTML = svg;
        const details = document.createElement('details');
        const summary = document.createElement('summary');
        summary.textContent = document.documentElement.lang.startsWith('fr') ? 'Code Mermaid' : 'Mermaid source';
        details.append(summary, block.parentElement.cloneNode(true));
        figure.append(details);
        block.parentElement.replaceWith(figure);
      } catch (error) { console.warn('Diagram source remains available:', error); }
    }
  } catch (error) { console.warn('Diagram renderer unavailable; showing source.', error); }
</script>
{{- end -}}
