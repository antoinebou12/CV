{{- /* Paired wrapper: responsive grid of codepen_card shortcodes. */ -}}
<style>
  .codepen-pen-grid {
    display: grid;
    gap: 1.25rem;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 22rem), 1fr));
  }
  .codepen-pen-grid .codepen-grid-card {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .codepen-pen-grid .codepen-grid-card h3 {
    font-size: 1rem;
    font-weight: 600;
    margin: 0 0 0.35rem 0;
    line-height: 1.3;
  }
  .codepen-pen-grid .codepen-grid-card .codepen-grid-caption {
    font-size: 0.875rem;
    opacity: 0.85;
    margin: 0 0 0.75rem 0;
    line-height: 1.45;
  }
  .codepen-pen-grid .codepen-grid-card a.codepen-grid-open {
    margin-top: 0.5rem;
    font-size: 0.875rem;
    font-weight: 500;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .codepen-pen-grid .codepen-grid-card a.codepen-grid-open:hover {
    opacity: 0.9;
  }
</style>
<div class="codepen-pen-grid not-prose my-8">
  {{- .Inner | .Page.RenderString -}}
</div>
