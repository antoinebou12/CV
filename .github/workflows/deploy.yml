name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Test sitemap merge script
        run: python3 "${GITHUB_WORKSPACE}/scripts/test_merge_root_sitemap.py"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.160.1"
          extended: true

      # Lockfile lives in the main repo under hugo/ (theme is a submodule — lockfile there is not in parent git).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hugo/package-lock.json

      - name: Build Hugo theme CSS (Tailwind)
        working-directory: hugo
        run: npm ci && npm run build:css

      - name: Prepare static files
        run: |
          mkdir -p _site
          # Copy HTML files
          for file in index.html index-en.html index-fr.html 404.html; do
            [ -f "$file" ] && cp "$file" _site/
          done
          # Copy image and asset files
          for file in *.png *.jpg *.jpeg *.ico *.webmanifest *.xml antoine.jpeg; do
            [ -f "$file" ] && cp "$file" _site/ 2>/dev/null || true
          done
          # Copy directories
          [ -d "css" ] && cp -r css _site/
          [ -d "linktree" ] && cp -r linktree _site/
          [ -d "papers" ] && cp -r papers _site/
          echo "Static files prepared."

      - name: Copy CV PDFs to Pages site root
        run: |
          if [ ! -f "cv-en/resume.pdf" ] || [ ! -f "cv-fr/resume.pdf" ]; then
            echo "Missing cv-en/resume.pdf or cv-fr/resume.pdf (build CVs or run compile-cv workflow first)"
            exit 1
          fi
          mkdir -p _site/cv-en _site/cv-fr
          cp -f cv-en/resume.pdf _site/cv-en/resume.pdf
          cp -f cv-fr/resume.pdf _site/cv-fr/resume.pdf
          echo "CV PDFs copied to _site/cv-en and _site/cv-fr"

      - name: Build Hugo blog
        env:
          HUGO_ENV: production
          HUGO_BASE_URL_OVERRIDE: ${{ vars.HUGO_BASE_URL }}
          HUGO_PARAMS_GITHUBPAGESREPO: ${{ github.event.repository.name }}
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          PAGES_ROOT="${{ steps.pages.outputs.base_url }}"
          PAGES_ROOT="${PAGES_ROOT%/}"
          # Canonical host must match where visitors load the site (custom domain on GitHub Pages).
          # Otherwise Permalink/absURL point at github.io while HTML is served from the custom domain,
          # breaking Subresource Integrity on CSS and wasting link preloads.
          if [ -n "${HUGO_BASE_URL_OVERRIDE}" ]; then
            HUGO_BASE="${HUGO_BASE_URL_OVERRIDE}"
          else
            HUGO_BASE="https://antoineboucher.info/${REPO}/blog/"
          fi
          case "${HUGO_BASE}" in
            */) ;;
            *) HUGO_BASE="${HUGO_BASE}/" ;;
          esac
          echo "configure-pages base_url (reference): ${PAGES_ROOT}"
          echo "Hugo baseURL (used for build): ${HUGO_BASE}"
          if [ -n "${PAGES_ROOT}" ] && [ "${PAGES_ROOT}" != "https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO}" ]; then
            echo "::notice::configure-pages base_url is ${PAGES_ROOT}; Hugo -b uses ${HUGO_BASE} so asset URLs match the custom domain."
          fi
          hugo --gc --minify -s hugo -d "${GITHUB_WORKSPACE}/_site/blog" -b "${HUGO_BASE}"
          # Same favicon as CV (site root); keep a copy under /blog/ for old /blog/favicon.ico links
          if [ -f "${GITHUB_WORKSPACE}/favicon.ico" ]; then
            cp -f "${GITHUB_WORKSPACE}/favicon.ico" "${GITHUB_WORKSPACE}/_site/blog/favicon.ico"
          fi

      - name: Promote agent-ready discovery assets to site root
        env:
          HUGO_BASE_URL_OVERRIDE: ${{ vars.HUGO_BASE_URL }}
        run: |
          set -euo pipefail
          ROOT="${GITHUB_WORKSPACE}/_site"
          REPO="${GITHUB_REPOSITORY#*/}"
          mkdir -p "${ROOT}/.well-known"
          if [ -f "${ROOT}/blog/robots.txt" ]; then
            cp -f "${ROOT}/blog/robots.txt" "${ROOT}/robots.txt"
          fi
          if [ -f "${ROOT}/blog/sitemap.xml" ]; then
            cp -f "${ROOT}/blog/sitemap.xml" "${ROOT}/sitemap.xml"
          fi
          if [ -d "${ROOT}/blog/.well-known" ]; then
            cp -a "${ROOT}/blog/.well-known/." "${ROOT}/.well-known/"
          fi
          if [ -f "${GITHUB_WORKSPACE}/hugo/static/_headers" ]; then
            cp -f "${GITHUB_WORKSPACE}/hugo/static/_headers" "${ROOT}/_headers"
          fi
          if [ -f "${ROOT}/blog/llms.txt" ]; then
            cp -f "${ROOT}/blog/llms.txt" "${ROOT}/llms.txt"
          fi
          # Default GitHub Pages project-site baseURL is https://antoineboucher.info/<repo>/blog/.
          # Static discovery JSON uses /blog/ until rewritten here when no custom HUGO_BASE_URL is set.
          if [ -z "${HUGO_BASE_URL_OVERRIDE}" ]; then
            for f in \
              "${ROOT}/.well-known/api-catalog" \
              "${ROOT}/.well-known/agent-skills/index.json" \
              "${ROOT}/.well-known/markdown-map.json" \
              "${ROOT}/_headers" \
              "${ROOT}/robots.txt" \
              "${ROOT}/llms.txt"; do
              [ -f "$f" ] || continue
              sed -i "s|https://antoineboucher.info/blog/|https://antoineboucher.info/${REPO}/blog/|g" "$f"
            done
            if [ -f "${ROOT}/.well-known/markdown-map.json" ]; then
              sed -i "s|\"/blog/agent/home.md\"|\"/${REPO}/blog/agent/home.md\"|g" "${ROOT}/.well-known/markdown-map.json"
            fi
            find "${ROOT}/.well-known" -type f -name '*.md' -print0 2>/dev/null | while IFS= read -r -d '' f; do
              sed -i "s|https://antoineboucher.info/blog/|https://antoineboucher.info/${REPO}/blog/|g" "$f"
            done
            if [ -d "${ROOT}/blog/agent" ]; then
              find "${ROOT}/blog/agent" -type f -name '*.md' -print0 | while IFS= read -r -d '' f; do
                sed -i "s|https://antoineboucher.info/blog/|https://antoineboucher.info/${REPO}/blog/|g" "$f"
              done
            fi
          fi

      - name: Merge static URLs into root sitemap and align robots Sitemap
        env:
          HUGO_BASE_URL_OVERRIDE: ${{ vars.HUGO_BASE_URL }}
        run: |
          set -euo pipefail
          ROOT="${GITHUB_WORKSPACE}/_site"
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ -n "${HUGO_BASE_URL_OVERRIDE}" ]; then
            H="${HUGO_BASE_URL_OVERRIDE}"
            case "${H}" in
              */) ;;
              *) H="${H}/" ;;
            esac
            case "${H}" in
              */blog/) SITE_ROOT="${H%/blog/}" ;;
              */blog) SITE_ROOT="${H%/blog}" ;;
              *) SITE_ROOT="${H%/}" ;;
            esac
          else
            SITE_ROOT="https://antoineboucher.info/${REPO}"
          fi
          LASTMOD=$(date -u +%Y-%m-%d)
          python3 "${GITHUB_WORKSPACE}/scripts/merge_root_sitemap.py" \
            --input "${ROOT}/sitemap.xml" \
            --output "${ROOT}/sitemap.xml" \
            --blog-dir "${ROOT}/blog" \
            --site-root "${SITE_ROOT}" \
            --lastmod "${LASTMOD}"
          SITEMAP_URL="${SITE_ROOT}/sitemap.xml"
          sed -i "s|^Sitemap:.*|Sitemap: ${SITEMAP_URL}|" "${ROOT}/robots.txt"

      - name: Validate deploy artifact
        run: |
          python3 "${GITHUB_WORKSPACE}/scripts/verify_deploy_build.py" \
            --site-dir "${GITHUB_WORKSPACE}/_site" \
            --repo "${GITHUB_REPOSITORY#*/}" \
            --repo-root "${GITHUB_WORKSPACE}"

      - name: List deploy tree
        run: |
          echo "Files to deploy (sample):"
          find _site -type f | head -40

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Hugo emits root-relative URLs like /REPO/blog/... for GitHub Pages project sites.
      # Lychee needs a filesystem path that matches that prefix plus --root-dir (see lychee docs).
      # Runs after deploy so broken links never block publishing.
      - name: Mirror project path prefix for link checker
        run: |
          ROOT="${GITHUB_WORKSPACE}/_site"
          REPO="${GITHUB_REPOSITORY#*/}"
          mkdir -p "${ROOT}/${REPO}"
          ln -sfn "../blog" "${ROOT}/${REPO}/blog"
          if [ -f "${ROOT}/favicon.ico" ]; then
            ln -sfn "../favicon.ico" "${ROOT}/${REPO}/favicon.ico"
          fi
          for d in cv-en cv-fr css linktree papers; do
            if [ -d "${ROOT}/${d}" ]; then
              ln -sfn "../${d}" "${ROOT}/${REPO}/${d}"
            fi
          done
          echo "Symlinked ${ROOT}/${REPO}/* -> published assets for /${REPO}/ URL prefix"

      - name: Check links in site output (advisory)
        id: lychee
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          fail: false
          failIfEmpty: false
          token: ${{ github.token }}
          args: >-
            --root-dir "${{ github.workspace }}/_site"
            --verbose
            --no-progress
            --max-retries 3
            --max-concurrency 8
            --max-redirects 20
            --exclude-path 'node_modules'
            ./_site

      - name: Link check note
        if: steps.lychee.outcome != 'success'
        run: |
          echo "::warning::Lychee reported broken or unreachable links. GitHub Pages deploy already completed."
