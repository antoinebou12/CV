name: Lighthouse CI

on:
  push:
    branches:
      - main
      - master
    paths:
      - "index-en.html"
      - "index-fr.html"
      - "css/**"
      - "js/**"
      - "hugo/layouts/**"
      - "hugo/assets/**"
      - "hugo/hugo.toml"
      - ".github/workflows/lighthouse.yml"
      - "lighthouserc.json"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "index-en.html"
      - "index-fr.html"
      - "css/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.15"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.169.0"
          extended: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: hugo/package-lock.json

      - name: Build _site for CV pages and the Hugo blog
        env:
          HUGO_ENV: production
          HUGO_PARAMS_GITHUBPAGESREPO: CV
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          mkdir -p "_site/${REPO}"
          for f in index.html index-en.html index-fr.html 404.html; do
            [ -f "$f" ] && cp "$f" "_site/${REPO}/"
          done
          for f in *.png *.jpg *.jpeg *.webp *.ico *.webmanifest; do
            [ -f "$f" ] && cp "$f" "_site/${REPO}/" 2>/dev/null || true
          done
          for d in css js images papers linktree; do
            [ -d "$d" ] && cp -r "$d" "_site/${REPO}/${d}"
          done
          # The blog lives under /CV/blog/ in production; the same URLs are audited here.
          hugo --gc --minify -s hugo -d "_site/${REPO}/blog" -b "http://localhost/${REPO}/blog/"

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
