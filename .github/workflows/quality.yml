name: Quality checks

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.15"

      - name: Install spell tools
        run: |
          pip install codespell
          sudo apt-get update -qq
          sudo apt-get install -y aspell aspell-en aspell-fr

      - name: Locale spellcheck (EN codespell, FR aspell)
        id: spellcheck
        continue-on-error: true
        run: |
          python scripts/ci/spellcheck.py 2>&1 | tee spellcheck.log
          exit "${PIPESTATUS[0]}"

      - name: Spellcheck report (advisory)
        if: always()
        run: bash scripts/ci/write_advisory_summary.sh "Spellcheck" "codespell (EN) + aspell (FR)" "${{ steps.spellcheck.outcome }}" spellcheck.log

  html-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Validate static HTML
        run: |
          npm install -g html-validate@9.7.0
          html-validate --config .htmlvalidate.json \
            index-en.html \
            index-fr.html \
            index.html \
            404.html \
            linktree/index.html

  en-fr-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.15"

      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt

      - name: Validate CV data schema
        run: python scripts/verify/validate_cv_data.py

      - name: EN/FR HTML parity
        run: python scripts/verify/check_en_fr_parity.py

      - name: Generated LaTeX matches data/cv.yaml
        run: python scripts/build/generate_cv.py --check

      - name: Design tokens in sync
        run: python scripts/build/sync_design_tokens.py --check

      - name: Regenerate AEO pages (check committed output)
        run: |
          python scripts/build/generate_aeo_content.py --all
          python scripts/html/sync_index_html.py
          git diff --exit-code index-en.html index-fr.html index.html

  project-docs-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: "0.169.0"
          extended: true

      - name: Build Hugo blog
        working-directory: hugo
        run: hugo --minify -d public

      - name: Repository notes structure tests
        run: CV_NOTES_SITE=hugo/public node --test scripts/verify/repository-notes.test.mjs scripts/verify/blog-links.test.mjs

  frontend-e2e:
    # Playwright checks for the blog chrome, SEO tags, dynamic tables, motion and reading tools.
    runs-on: ubuntu-latest
    env:
      HUGO_ENV: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/ux-audit/package-lock.json

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: "0.169.0"
          extended: true

      - name: Install Playwright
        working-directory: tools/ux-audit
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build, serve and test the site
        working-directory: tools/ux-audit
        run: node scripts/run-local-e2e.mjs e2e/enhancements.spec.ts

      - name: LaTeX CV PDFs (pages, text, links, margins)
        working-directory: tools/ux-audit
        run: npx playwright test --config playwright.e2e.config.ts e2e/cv-pdf.spec.ts

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-e2e-report
          path: |
            tools/ux-audit/e2e-report
            tools/ux-audit/e2e-results
          retention-days: 7
