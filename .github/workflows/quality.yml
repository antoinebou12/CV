name: Quality checks

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install spell tools
        run: |
          pip install codespell
          sudo apt-get update -qq
          sudo apt-get install -y aspell aspell-en aspell-fr

      - name: Locale spellcheck (EN codespell, FR aspell)
        run: python scripts/ci/spellcheck.py

  html-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate static HTML
        run: |
          npm install -g html-validate@9.7.0
          html-validate --config .htmlvalidate.json \
            index-en.html \
            index-fr.html \
            about-en.html \
            about-fr.html \
            index.html \
            404.html \
            linktree/index.html

  en-fr-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt

      - name: Validate CV data schema
        run: python scripts/verify/validate_cv_data.py

      - name: EN/FR HTML parity
        run: python scripts/verify/check_en_fr_parity.py

      - name: Generated LaTeX matches data/cv.yaml
        run: python scripts/build/generate_cv.py --check

      - name: Regenerate AEO pages (check committed output)
        run: |
          python scripts/build/generate_aeo_content.py --all
          python scripts/html/sync_index_html.py
          git diff --exit-code about-en.html about-fr.html index-en.html index-fr.html index.html
